<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b51f62">
<title>Знайомства UA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff7fa;color:#171217}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 18px;position:sticky;top:0;background:#fff7faeF;backdrop-filter:blur(10px);z-index:5}
.logo{font-size:28px;font-weight:800}.logo span{color:#b51f62}.heart{font-size:28px}
button{border:0;border-radius:18px;padding:15px 20px;font-size:17px;font-weight:700;cursor:pointer}
.primary{background:#c52267;color:#fff}.secondary{background:#ffe0eb;color:#a71955}
main{max-width:900px;margin:auto;padding:15px 18px 60px}
.hero{text-align:center;padding:50px 0 30px}.badge{display:inline-block;background:#ffe8f0;color:#9d2053;padding:10px 18px;border-radius:30px;font-weight:700}
h1{font-size:clamp(38px,8vw,70px);line-height:1.02;margin:25px 0 14px}.hero p{font-size:19px;color:#665c62}
.panel{background:white;border:1px solid #f0dce4;border-radius:25px;padding:20px;margin-top:25px;box-shadow:0 8px 30px #8d31500d}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-weight:700;display:block;margin-bottom:7px}input,select,textarea{width:100%;padding:15px;border:1px solid #dfccd4;border-radius:15px;font-size:16px;background:#fff}
textarea{min-height:100px;resize:vertical}.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin-top:20px}
.card{background:#fff;border-radius:22px;overflow:hidden;border:1px solid #f0dce4}.photo{height:230px;background:#ffe2ec;display:flex;align-items:center;justify-content:center;font-size:70px}.card-body{padding:16px}.card h3{margin:0 0 7px}.muted{color:#756b70}.empty{text-align:center;padding:25px;color:#756b70}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff;border-radius:28px 28px 0 0;width:min(700px,100%);max-height:92vh;overflow:auto;padding:22px}
.sheet-top{display:flex;justify-content:space-between;align-items:center}.close{background:#f3edf0;border-radius:50%;width:42px;height:42px;padding:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.preview{width:120px;height:120px;border-radius:18px;object-fit:cover;background:#ffe2ec;display:block;margin:8px 0}
.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}
@media(max-width:600px){.filters,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}header{padding:16px 14px}.logo{font-size:23px}.hero{padding-top:30px}}
</style>
</head>
<body>
<header>
  <div class="logo">Знайомства <span>UA</span><div class="heart">💗</div></div>
  <button class="primary" onclick="openForm()">Створити анкету</button>
</header>

<main>
<section class="hero">
  <div class="badge">🇺🇦 Знайомства в Україні</div>
  <h1>Знайди людину,<br>з якою хочеться бути</h1>
  <p>Створи свою анкету та знаходь нові знайомства.</p>
  <button class="primary" onclick="openForm()">Створити свою анкету →</button>
</section>

<section class="panel">
  <h2>Пошук</h2>
  <div class="filters">
    <div><label>Шукаю</label><select id="seek"><option>жінку</option><option>чоловіка</option><option>будь-кого</option></select></div>
    <div><label>Вік</label><select id="age"><option value="18-30">18–30</option><option value="25-40">25–40</option><option value="30-50">30–50</option><option value="40-60">40–60</option></select></div>
    <div><label>Місто</label><input id="cityFilter" placeholder="Наприклад, Київ"></div>
    <div style="display:flex;align-items:end"><button class="secondary" style="width:100%" onclick="renderProfiles()">Показати анкети</button></div>
  </div>
  <div id="profiles" class="profiles"></div>
</section>
</main>

<div class="modal" id="modal">
<div class="sheet">
  <div class="sheet-top"><h2>Створення анкети</h2><button class="close" onclick="closeForm()">×</button></div>
  <form id="profileForm">
    <div class="form-grid">
      <div><label>Ім'я *</label><input id="name" required maxlength="40" placeholder="Ваше ім'я"></div>
      <div><label>Вік *</label><input id="userAge" type="number" min="18" max="99" required placeholder="18"></div>
      <div><label>Місто *</label><input id="city" required maxlength="40" placeholder="Ваше місто"></div>
      <div><label>Я</label><select id="gender"><option>жінка</option><option>чоловік</option></select></div>
      <div><label>Шукаю</label><select id="looking"><option>жінку</option><option>чоловіка</option><option>будь-кого</option></select></div>
      <div><label>Фото</label><input id="photo" type="file" accept="image/*"></div>
      <div class="full"><label>Про себе</label><textarea id="about" maxlength="500" placeholder="Розкажіть трохи про себе..."></textarea></div>
    </div>
    <img id="preview" class="preview" alt="" style="display:none">
    <div class="actions"><button type="button" class="secondary" onclick="closeForm()">Скасувати</button><button class="primary" type="submit">Опублікувати анкету</button></div>
  </form>
</div>
</div>

<script>
const KEY='znayomstva_ua_profiles';
let photoData='';
function getProfiles(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function saveProfiles(p){localStorage.setItem(KEY,JSON.stringify(p))}
function openForm(){document.getElementById('modal').classList.add('show')}
function closeForm(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm()});
document.getElementById('photo').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=()=>{photoData=r.result;const p=document.getElementById('preview');p.src=photoData;p.style.display='block'};r.readAsDataURL(f);
});
document.getElementById('profileForm').addEventListener('submit',e=>{
 e.preventDefault();
 const profile={id:Date.now(),name:document.getElementById('name').value.trim(),age:+document.getElementById('userAge').value,city:document.getElementById('city').value.trim(),gender:document.getElementById('gender').value,looking:document.getElementById('looking').value,about:document.getElementById('about').value.trim(),photo:photoData};
 const profiles=getProfiles();profiles.unshift(profile);saveProfiles(profiles);e.target.reset();photoData='';document.getElementById('preview').style.display='none';closeForm();renderProfiles();alert('Анкету створено! Вона збережена на цьому пристрої.');});
function renderProfiles(){
 const box=document.getElementById('profiles'), city=document.getElementById('cityFilter').value.trim().toLowerCase(), seek=document.getElementById('seek').value;
 let p=getProfiles().filter(x=>!city||x.city.toLowerCase().includes(city));
 if(seek!=='будь-кого')p=p.filter(x=>x.gender===seek);
 if(!p.length){box.innerHTML='<div class="empty">Поки що анкет немає. Будьте першим — створіть свою! 💗</div>';return}
 box.innerHTML=p.map(x=>`<article class="card"><div class="photo">${x.photo?`<img src="${x.photo}" style="width:100%;height:100%;object-fit:cover">`:'👤'}</div><div class="card-body"><h3>${esc(x.name)}, ${x.age}</h3><div class="muted">📍 ${esc(x.city)} · ${esc(x.gender)}</div><p>${esc(x.about||'Користувач поки нічого не розповів про себе.')}</p><button class="secondary" onclick="alert('Функція спілкування буде доступна після підключення сервера.')">Написати</button></div></article>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
renderProfiles();
</script>
</body>
</html>
